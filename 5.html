<!DOCTYPE html>
<html>
<head>

    <title>Online Book Store</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Times New Roman", Arial, sans-serif;
        }

        /* =================================================
           THREE FRAME LAYOUT
           ================================================= */

        .main {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* TOP FRAME */
        .top-frame {
            height: 25%;
            border: 1px solid black;
        }

        /* BOTTOM AREA */
        .bottom {
            height: 75%;
            display: flex;
        }

        /* LEFT FRAME */
        .left-frame {
            width: 20%;
            border-left: 1px solid black;
            border-right: 1px solid black;
            border-bottom: 1px solid black;
        }

        /* RIGHT FRAME */
        .right-frame {
            width: 80%;
            border-right: 1px solid black;
            border-bottom: 1px solid black;
            overflow: auto;
        }


        /* =================================================
           TOP FRAME
           ================================================= */

        .top-table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
        }

        .top-table td {
            border: 1px solid black;
            text-align: center;
        }

        .logo {
            width: 20%;
            font-size: 20px;
            font-weight: bold;
        }

        .site-name {
            font-size: 24px;
            font-weight: bold;
        }

        .menu {
            height: 35px;
        }

        .menu a {
            text-decoration: none;
            color: black;
            font-size: 17px;
        }

        .menu a:hover {
            background-color: yellow;
        }


        /* =================================================
           LEFT FRAME
           ================================================= */

        .left-frame a {
            display: block;
            padding: 8px 12px;
            text-decoration: none;
            color: black;
            font-size: 18px;
        }

        .left-frame a:hover {
            background-color: yellow;
        }


        /* =================================================
           RIGHT PAGE
           ================================================= */

        .page {
            padding: 20px;
        }

        .page h2 {
            text-align: center;
        }


        /* =================================================
           LOGIN
           ================================================= */

        .login-table {
            margin: 50px auto;
        }

        .login-table td {
            padding: 8px;
            font-size: 18px;
        }

        input[type="text"],
        input[type="password"] {
            width: 180px;
            height: 28px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 8px 20px;
            font-size: 16px;
            margin: 5px;
        }


        /* =================================================
           REGISTRATION
           ================================================= */

        .registration-table {
            margin: auto;
        }

        .registration-table td {
            padding: 6px;
        }

        .registration-table input[type="text"],
        .registration-table input[type="password"] {
            width: 220px;
        }

        select {
            padding: 5px;
        }

        textarea {
            width: 220px;
            height: 70px;
        }


        /* =================================================
           CATALOGUE
           ================================================= */

        .catalogue {
            width: 95%;
            margin: auto;
            border-collapse: collapse;
        }

        .catalogue th,
        .catalogue td {
            border: 1px solid black;
            padding: 8px;
        }

        .catalogue th {
            text-align: center;
        }

        .book-cover {
            width: 100px;
            height: 125px;
            margin: auto;
            border: 1px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }

        .xml {
            background-color: #f5d27a;
        }

        .ai {
            background-color: #7fc99b;
        }

        .java {
            background-color: #6fa6c9;
        }

        .html {
            background-color: #dddddd;
        }

        .cart-button {
            background-color: #eab53d;
            border: 1px solid #555;
            border-radius: 10px;
            padding: 5px 15px;
            cursor: pointer;
        }


        /* =================================================
           CART
           ================================================= */

        .cart-table {
            width: 90%;
            margin: 30px auto;
            border-collapse: collapse;
        }

        .cart-table th,
        .cart-table td {
            padding: 8px;
            text-align: left;
        }

        .total {
            font-weight: bold;
            font-size: 18px;
        }


        /* =================================================
           DEPARTMENT CATALOGUE
           ================================================= */

        .department-table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
        }

        .department-table th,
        .department-table td {
            border: 1px solid black;
            padding: 10px;
        }

        .department-table th {
            background-color: #eeeeee;
        }

    </style>

</head>


<body>


<div class="main">


    <!-- =================================================
         TOP FRAME
         ================================================= -->

    <div class="top-frame">

        <table class="top-table">

            <tr>

                <td class="logo">
                    LOGO
                </td>

                <td colspan="4" class="site-name">
                    ONLINE BOOK STORE
                </td>

            </tr>


            <tr class="menu">

                <td>
                    <a href="#" onclick="showPage('home')">
                        Home
                    </a>
                </td>

                <td>
                    <a href="#" onclick="showPage('login')">
                        Login
                    </a>
                </td>

                <td>
                    <a href="#" onclick="showPage('registration')">
                        Registration
                    </a>
                </td>

                <td>
                    <a href="#" onclick="showPage('catalogue')">
                        Catalogue
                    </a>
                </td>

                <td>
                    <a href="#" onclick="showPage('cart')">
                        Cart
                    </a>
                </td>

            </tr>

        </table>

    </div>



    <!-- =================================================
         LEFT + RIGHT FRAMES
         ================================================= -->

    <div class="bottom">


        <!-- ================= LEFT FRAME ================= -->

        <div class="left-frame">

            <a href="#" onclick="showPage('cse')">
                CSE
            </a>

            <a href="#" onclick="showPage('ece')">
                ECE
            </a>

            <a href="#" onclick="showPage('eee')">
                EEE
            </a>

            <a href="#" onclick="showPage('civil')">
                CIVIL
            </a>

        </div>



        <!-- ================= RIGHT FRAME ================= -->

        <div class="right-frame" id="rightFrame">

            <!-- HOME PAGE WILL BE LOADED HERE -->

        </div>


    </div>

</div>
